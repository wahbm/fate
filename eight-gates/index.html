<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <base href="../" />
    <link rel="stylesheet" href="./styles.css" />
    <title>FATE · 八方牌局</title>
  </head>
  <body>
    <div id="app" aria-live="polite"></div>
    <script>
      const referrerPath = document.referrer ? new URL(document.referrer).pathname.replace(/\/+$/, '') : '';
      const navigation = window.performance?.getEntriesByType?.('navigation')?.[0];
      const cameFromRoot = referrerPath === '/fate' || navigation?.redirectCount > 0;
      if (!window.location.hash) window.location.hash = cameFromRoot ? '#/' : '#/eight-gates';
    </script>
    <script type="module" src="./app.js"></script>
  </body>
</html>
